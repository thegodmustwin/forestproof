<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
$robots
<title>Satellite visibility | ForestProof</title>
<style>
:root{color-scheme:light;--paper:#f8f6ef;--ink:#1d3028;--quiet:#4d6054;--rule:#c7cbbb;--green:#225d43;--pale:#e7ebdf;--amber:#79491c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.55}
main:focus{outline:none}
a{color:var(--green);text-underline-offset:.21em}
:is(a,summary):focus-visible{outline:3px solid var(--green);outline-offset:4px}
.skip{position:absolute;top:0;left:1rem;transform:translateY(-110%);padding:.65rem;background:var(--paper)}
.skip:focus{transform:translateY(0)}
.frame{width:min(100% - 3rem,65rem);margin-inline:auto}
.masthead{min-height:4.65rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--rule)}
.brand{display:inline-flex;align-items:center;min-height:2.75rem;color:var(--ink);font:bold 1.45rem Georgia,serif;letter-spacing:-.05em;text-decoration:none}
.brand[href]:hover{text-decoration:underline}
.flag{font-size:.8rem;font-weight:650;color:var(--amber)}
.intro{padding:clamp(2rem,5vw,3.65rem) 0 1.55rem}
.eyebrow{font-size:.75rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--quiet)}
h1,h2,h3,p{margin:0}
h1{font:normal clamp(2.8rem,7vw,5.75rem)/.99 Georgia,serif;letter-spacing:-.065em;margin:.42rem 0 .75rem}
h2,h3{font-family:Georgia,serif;font-weight:normal;line-height:1.17;letter-spacing:-.036em}
.intro>p:last-child{max-width:58ch;color:var(--quiet)}
.reading-guide{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(0,2.3fr);gap:clamp(.65rem,3vw,2.2rem);padding:1.15rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:1.5rem}
.reading-guide h2{font-size:clamp(1.35rem,3vw,1.8rem)}
.reading-guide p{font-size:.96rem;color:var(--quiet);max-width:64ch}
.reading-guide p+p{margin-top:.55rem}
.reading-guide strong{color:var(--ink)}
.status{font-size:.88rem;color:var(--quiet);margin-bottom:.75rem}
.status strong{color:var(--ink)}
.status.overdue strong{color:var(--amber)}
.pass{display:grid;grid-template-columns:minmax(11rem,1fr) minmax(0,2.3fr);gap:clamp(1rem,3vw,2.2rem);align-items:start}
.pass h2{font-size:clamp(1.9rem,3.7vw,3.3rem);margin-top:.3rem}
.pass h3{font-size:1.55rem}
.latest{border:1px solid var(--rule);background:#edeee3;padding:clamp(1rem,3vw,2rem)}
.grids{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.grid-row{display:grid;grid-template-columns:4.5rem minmax(1rem,1fr) 11.25rem;align-items:center;gap:.1rem .75rem;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.grid-name{font:650 .83rem ui-monospace,Consolas,monospace}
.track{height:.55rem;background:#dce3d8;border-radius:.12rem}
.track span{height:100%;display:block;background:var(--green);border-radius:inherit}
.reading{display:flex;align-items:baseline;justify-content:space-between;gap:.65rem;min-width:11rem;font-size:.78rem;color:var(--quiet);font-variant-numeric:tabular-nums}
.reading strong{font-size:1rem;color:var(--ink)}
.vegetation{grid-column:2/-1;text-align:right;font-size:.77rem;color:var(--quiet)}
.history{margin:clamp(1.55rem,4vw,2.85rem) 0 1.4rem}
.history h2{font-size:clamp(1.6rem,3vw,2.55rem);margin:0 0 .55rem}
.history .pass{padding:.85rem 0}
details{max-width:72ch;margin:1rem 0 1.75rem}
summary{cursor:pointer;color:var(--green);font-weight:650;min-height:2.75rem;padding:.55rem 0}
details p{color:var(--quiet);margin:.25rem 0 .75rem}
.unavailable{border:1px solid var(--rule);padding:1.5rem;margin-bottom:2rem}
.unavailable h2{font-size:1.85rem}
.unavailable p{color:var(--quiet);margin-top:.4rem}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.25rem 1rem;color:var(--quiet);font-size:.85rem;border-top:1px solid var(--rule);padding:1rem 0 1.55rem}
footer a{display:inline-block;padding:.45rem 0}
@media(max-width:42rem){
.frame{width:calc(100% - 2rem)}
.reading-guide,.pass{grid-template-columns:minmax(0,1fr);gap:.7rem}
.grid-row{grid-template-columns:3.8rem minmax(.5rem,1fr) 10rem;gap:.15rem .5rem}
.reading{min-width:0;gap:.32rem}
.vegetation{grid-column:1/-1}
}
@media(max-width:22rem){
.track{grid-column:1/-1;grid-row:3}
.grid-row{grid-template-columns:1fr auto}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to visibility report</a>
<div class="frame">
<header class="masthead">$brand$masthead</header>
<main id="main" tabindex="-1">
<header class="intro">
<p class="eyebrow">Provisional Geta research area</p>
<h1>Satellite visibility</h1>
<p>See how much of this area the Sentinel-2 satellite could assess on each of the dates below.</p>
</header>
$content
</main>
<footer><p>$attribution</p><a href="https://sentiwiki.copernicus.eu/web/s2-processing#S2Processing-ClassificationMaskGeneration">Copernicus classification method</a></footer>
</div>
</body>
</html>
