name: Verify ForestProof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest

  web:
    name: Web checks (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Temporary PR preparation: capture a generated lockfile without writing to main.
      - name: Generate review lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          echo FORESTPROOF_LOCKFILE_BEGIN
          base64 -w 1024 package-lock.json | sed 's/^/FORESTPROOF_LOCK_CHUNK=/'
          echo FORESTPROOF_LOCKFILE_END
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --omit=dev --audit-level=high
