name: Verify ForestProof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Check development Compose port bindings
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --profile postgis config --format json > "$RUNNER_TEMP/forestproof-compose.json"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"forestproof-compose.json"))); ports={(name,str(p["target"]),str(p["published"]),p.get("host_ip")) for name,s in d["services"].items() for p in s.get("ports", [])}; assert ports == {("db","5432","5432","127.0.0.1"),("api","8000","8000","127.0.0.1"),("web","3000","3000","127.0.0.1")}, ports'

  web:
    name: Web checks (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - name: Browser map smoke (Node 24)
        if: matrix.node == '24'
        run: npm run smoke:browser
        env:
          FORESTPROOF_CHROME_EXECUTABLE: /usr/bin/google-chrome
      - run: npm audit --omit=dev --audit-level=high
      - name: Build optional web container (Node 24)
        if: matrix.node == '24'
        run: docker build --tag forestproof-web-ci .
