name: Raster research checks

on:
  pull_request:
    paths:
      - 'tools/nasa_dist_research/**'
      - 'tools/glad_l_research/**'
      - 'tools/source_status/**'
      - 'tools/sentinel_visibility/**'
      - 'tools/owner_review/**'
      - 'tools/alert_publication/**'
      - '.github/workflows/nasa-research.yml'
  push:
    branches: [main]
    paths:
      - 'tools/nasa_dist_research/**'
      - 'tools/glad_l_research/**'
      - 'tools/source_status/**'
      - 'tools/sentinel_visibility/**'
      - 'tools/owner_review/**'
      - 'tools/alert_publication/**'
      - '.github/workflows/nasa-research.yml'

permissions:
  contents: read

jobs:
  synthetic-raster-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/nasa_dist_research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_inspect_dist_layers
      - name: Verify GLAD-L observation recency inspector
        working-directory: tools/glad_l_research
        run: python -m unittest -v
      - name: Verify source-status publication preview
        working-directory: tools/source_status
        run: python -m unittest -v
      - name: Verify Sentinel-2 visibility inspection
        working-directory: .
        run: python -m unittest discover -s tools/sentinel_visibility -v
      - name: Verify private owner review
        working-directory: .
        run: python -m unittest discover -s tools/owner_review -v
      - name: Verify private alert-publication staging
        working-directory: .
        run: python -m unittest discover -s tools/alert_publication -v
